name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/mplcache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,runtime]

      - name: Verify lockfile consistency
        run: |
          python scripts/check_lock.py

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy

      - name: Pytest
        run: pytest

      - name: CLI Smoke
        run: |
          healingstone-run --data-dir data/sample/3d --output-dir smoke-artifacts --min-required-accuracy 0 --allow-overwrite-run
          run_dir=$(find smoke-artifacts/runs -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          test -f "$run_dir/reconstruction.ply"
          test -f "$run_dir/metrics.json"
          python - <<'PY'
          import json
          import pathlib
          runs = sorted(pathlib.Path("smoke-artifacts/runs").iterdir())
          run_dir = runs[-1]
          metrics = json.loads((run_dir / "metrics.json").read_text())
          assert 0.0 <= metrics["reconstruction_completeness"] <= 1.0
          assert metrics["successful_alignments"] >= 0
          PY
